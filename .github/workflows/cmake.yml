name: ClamCove CMake Build

on:
  push:
    branches:
      - release/**
  pull_request:
    branches:
      - release/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "linux-x64 rarlab",      os: ubuntu-24.04,     cmake_args: "" }
          - { name: "linux-x64 libarchive",  os: ubuntu-24.04,     cmake_args: "-DENABLE_UNRAR_LIBARCHIVE=ON" }
          - { name: "linux-arm64 rarlab",    os: ubuntu-24.04-arm, cmake_args: "" }
          - { name: "linux-arm64 libarchive", os: ubuntu-24.04-arm, cmake_args: "-DENABLE_UNRAR_LIBARCHIVE=ON" }
          - { name: "macos-arm64 rarlab",    os: macos-latest,     cmake_args: "" }
          - { name: "macos-arm64 libarchive", os: macos-latest,     cmake_args: "-DENABLE_UNRAR_LIBARCHIVE=ON" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex check libbz2-dev libcurl4-openssl-dev \
            libjson-c-dev libmilter-dev libncurses-dev libpcre2-dev libssl-dev libxml2-dev pkg-config python3-pytest zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bison flex pkgconf bzip2 check curl json-c libxml2 ncurses openssl@3 pcre2 zlib pytest
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DENABLE_STATIC_LIB=ON -DENABLE_EXAMPLES=ON
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure --parallel 4 ${{ runner.os == 'macOS' && '--exclude-regex "^freshclam$"' || '' }}

  windows:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "windows-x64 rarlab",     cmake_args: "" }
          - { name: "windows-x64 libarchive", cmake_args: "-DENABLE_UNRAR_LIBARCHIVE=ON" }
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vcpkg-cache
          key: vcpkg-windows-x64-${{ hashFiles('.github/workflows/cmake.yml') }}
          restore-keys: vcpkg-windows-x64-

      - name: Install dependencies
        shell: bash
        run: |
          mkdir -p vcpkg-cache
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install --triplet x64-windows \
            curl[openssl] openssl json-c libxml2 pcre2 check pthreads zlib pdcurses bzip2
          python -m pip install pytest

      - name: Save vcpkg binary cache
        if: always() && hashFiles('vcpkg-cache/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vcpkg-cache
          key: vcpkg-windows-x64-${{ hashFiles('.github/workflows/cmake.yml') }}-${{ matrix.name }}-${{ github.run_id }}

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DLIBCHECK_LIBRARY="$VCPKG_INSTALLATION_ROOT/installed/x64-windows/lib/checkDynamic.lib"
          -DENABLE_STATIC_LIB=ON -DENABLE_EXAMPLES=ON
          ${{ matrix.cmake_args }}

      - name: Build
        shell: bash
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        shell: bash
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure --parallel 4
